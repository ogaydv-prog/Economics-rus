<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model AD-AS — Economics & Macroeconomics</title>
<style>
:root{--ink:#172333;--muted:#8c9ba5;--paper:#f7f3e9;--card:#1a1d24;--navy:#173f5f;--teal:#0b8f8c;--red:#d65745;--violet:#7655b5;--gold:#d49a26;--line:#2a2e39;--shadow:0 12px 32px #00000040;--active:#38bdf8}
*{box-sizing:border-box} body{margin:0;color:#e5e7eb;font-family:Arial, Helvetica, sans-serif;background:#121316;min-height:100vh}
button,input{font:inherit} .app{max-width:1500px;margin:auto;padding:22px}

/* Header Settings */
.mast{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:22px 26px;border:1px solid #2a2e39;border-radius:20px;background:#1a1d24;box-shadow:var(--shadow)}
h1{font-family:Arial, Helvetica, sans-serif;font-weight:900;font-size:clamp(26px,4vw,44px);line-height:1.0;margin:0 0 8px;letter-spacing:-.02em;color:#0052cc}
.subtitle{color:#ff3333;font-size:15px;line-height:1.3;font-weight:700}
.lang{display:flex;padding:4px;border:1px solid #2a2e39;border-radius:10px;background:#121316}.lang button{border:0;background:transparent;padding:8px 14px;border-radius:6px;font-weight:800;color:#9ca3af;cursor:pointer}.lang button.on{background:#2563eb;color:white;box-shadow:0 4px 12px #2563eb40}

/* Navigation */
.nav-container{margin:18px 0 14px;display:flex;flex-direction:column;gap:8px}
.main-tabs{display:flex;gap:8px;border-bottom:2px solid #2a2e39;padding-bottom:1px}
.main-tab{border:1px solid #2a2e39;background:#1a1d24;color:#9ca3af;padding:11px 20px;border-radius:12px 12px 0 0;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}
.main-tab:hover{background:#252932;color:#fff}
.main-tab.on{background:#2563eb;border-color:#2563eb;color:white}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#1a1d24;border:1px solid #2a2e39;border-radius:0 12px 12px 12px}
.sub-tab{white-space:nowrap;border:1px solid #374151;background:#121316;color:#e5e7eb;padding:7px 13px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.sub-tab:hover{opacity:.8}
.sub-tab.on{border-color:#fff !important;box-shadow:0 0 8px rgba(255,255,255,0.4)}

.stage{display:grid;grid-template-columns:minmax(320px,410px) minmax(520px,1fr);gap:16px;align-items:start}
.panel{background:#1a1d24;border:1px solid #2a2e39;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:18px 20px 14px;border-bottom:1px solid #2a2e39;background:#121316}
.panel-head h2{font-family:Arial, Helvetica, sans-serif;font-weight:800;margin:0;font-size:19px;color:#fff}
.panel-head p{font-size:12px;line-height:1.45;color:#9ca3af;margin:6px 0 0}

/* Portrait Card */
.portrait-card{display:flex;align-items:center;gap:14px;background:#121316;border:1px solid #374151;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.portrait-img{width:64px;height:76px;object-fit:cover;border-radius:10px;border:2px solid #38bdf8;background:#173f5f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.portrait-info h4{margin:0;font-size:14px;color:#fff;font-weight:800}
.portrait-info p{margin:4px 0 0;font-size:11px;color:#9ca3af;line-height:1.35}

/* Controls Area */
.controls{padding:16px 18px;display:grid;gap:14px}
.control{padding:13px;border:1px solid #2a2e39;border-radius:14px;background:#121316}
.control-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px}
.control label{font-size:12px;font-weight:800;color:#e5e7eb}
.value{font:800 12px ui-monospace,monospace;color:#38bdf8;background:#1e293b;padding:4px 7px;border-radius:7px;border:1px solid #334155}
.control small{display:block;color:#9ca3af;font-size:10px;line-height:1.4;margin-top:7px}

input[type=range]{--c:#38bdf8;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:2px;background:linear-gradient(90deg,var(--c) 0 var(--pct,50%),#374151 var(--pct,50%))}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:22px;margin-top:-7px;border:1px solid #6b7280;border-radius:3px;background:linear-gradient(90deg,#374151 40%,var(--c) 45%,var(--c) 55%,#374151 60%);box-shadow:0 2px 4px #0008}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid #374151;background:#252932;color:#e5e7eb;font-weight:800;font-size:11px;padding:9px 12px;border-radius:9px;cursor:pointer}
.btn:hover{background:#374151}
.btn.primary{background:#0b8f8c;color:#fff;border-color:#0b8f8c}

/* Chart Canvas */
.viz{padding:16px;background:#fff;border-color:#d7cfbf}
.viz-top{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:9px}
.badge{font:800 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-radius:7px;background:#edf1f4;color:#476071}
.status{font:800 12px ui-monospace,monospace;color:#0b8f8c}

svg{display:block;width:100%;height:auto;min-height:460px;border:1px solid #e5ded2;border-radius:15px;background:#fff}
.grid{stroke:#ebe7df;stroke-width:1}.axis{stroke:#8993a0;stroke-width:1.2}
.curve{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.lras-line{stroke:#d49a26;stroke-width:4.5;stroke-dasharray:none} /* Bold Solid LRAS Curve */
.old{stroke-dasharray:6 5;opacity:.45}.dash{stroke-dasharray:5 5}
.eq{stroke:#172333;fill:#fff;stroke-width:2}.tick,.label{font:11px ui-monospace,monospace;fill:#5f6d7c}
.legend{font:700 11px ui-monospace,monospace}.anno{font:700 11px ui-sans-serif,sans-serif;fill:#172333}

.explain{margin-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{border:1px solid #e2dbce;border-radius:12px;padding:11px;background:#fbf7ef;color:#172333}
.metric b{display:block;font:800 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:#647184}
.metric strong{display:block;font:700 18px Arial, sans-serif;margin-top:5px;color:#173f5f}
.metric span{font-size:10px;color:#647184}

.note{margin-top:10px;border-left:4px solid #d49a26;background:#fff7df;padding:11px 12px;border-radius:0 10px 10px 0;font-size:12px;line-height:1.5;color:#172333}
.formula{font:700 13px ui-monospace,monospace;color:#173f5f;background:#eef4f8;border-radius:9px;padding:10px;margin-top:10px;overflow:auto}

/* Centered Footer */
.foot{padding:24px 10px 12px;color:#9ca3af;font-size:11px;line-height:1.5;text-align:center;border-top:1px solid #2a2e39;margin-top:24px}
</style>
</head>
<body>
<main class="app">
 <header class="mast">
  <div>
    <h1>Model AD-AS</h1>
    <div class="subtitle">Economics | Macroeconomics | AlmaU 2026 | SDTE</div>
  </div>
  <div class="lang">
    <button id="ruBtn" class="on">RU</button>
    <button id="enBtn">EN</button>
  </div>
 </header>
 
 <div class="nav-container">
   <div class="main-tabs" id="mainTabs"></div>
   <div class="sub-tabs" id="subTabs"></div>
 </div>

 <section class="stage" id="stage">
  <aside class="panel">
    <div class="panel-head"><h2 id="moduleTitle"></h2><p id="moduleIntro"></p></div>
    <div class="controls">
      <div id="portraitArea"></div>
      <div id="controls" style="display:grid;gap:14px"></div>
    </div>
  </aside>
  <article class="panel viz">
    <div class="viz-top"><span class="badge" id="modelBadge"></span><span class="status" id="status"></span></div>
    <svg id="chart" viewBox="0 0 760 500" role="img"></svg>
    <div class="explain" id="metrics"></div>
    <div class="formula" id="formula"></div>
    <div class="note" id="note"></div>
  </article>
 </section>
 <footer class="foot" id="foot">
   AlmaU 2026 • SDTE
 </footer>
</main>

let lang='ru',active=0,currentGroup=0,state={},adjust=0,round=0,timer=null;
let pointsDrawn = { p05: false, p10: false, p20: false, curveDrawn: false };

const YN=5,PE=4,ALPHA=.65,B=.65;
const $=s=>document.querySelector(s);
const fmt=x=>Number(x).toFixed(Math.abs(x)%1?2:1).replace(/\.00$/,'');

function resetState(){
  state={}; 
  const m=T[lang].modules[active]; 
  if(m) m.controls.forEach(x=>state[x[0]]=x[4]); 
  adjust=0;round=0;clearInterval(timer);
}

function shell(){
  const s=STRUCTURE[lang];
  $('#modelBadge').textContent=s.badge;
  $('#ruBtn').classList.toggle('on',lang==='ru'); $('#enBtn').classList.toggle('on',lang==='en');
  
  const groups = s.mainGroups;
  $('#mainTabs').innerHTML = groups.map((g, idx) => `<button class="main-tab ${idx === currentGroup ? 'on' : ''}" data-g="${idx}">${g.title}</button>`).join('');

  const activeModules = groups[currentGroup].modules;
  if (activeModules.length > 1) {
    $('#subTabs').style.display = 'flex';
    $('#subTabs').innerHTML = activeModules.map((mIdx, i) => {
      const col = T[lang].tabsColors[i % T[lang].tabsColors.length];
      const isSelected = mIdx === active;
      return `<button class="sub-tab ${isSelected ? 'on' : ''}" style="border-color:${col}" data-m="${mIdx}">${T[lang].tabs[mIdx]}</button>`;
    }).join('');
  } else {
    $('#subTabs').style.display = 'none';
  }

  $('#mainTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    currentGroup = +b.dataset.g;
    active = STRUCTURE[lang].mainGroups[currentGroup].modules[0];
    resetState(); shell();
  });

  $('#subTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    active = +b.dataset.m;
    resetState(); shell();
  });

  module();
}

function module(){
  const m=T[lang].modules[active]; $('#stage').hidden=false;
  $('#moduleTitle').textContent=m.t; $('#moduleIntro').textContent=m.i;
  
  // Render Economist Portrait
  const p = PORTRAITS[m.p];
  if (p) {
    const pData = p[lang];
    $('#portraitArea').innerHTML = `
      <div class="portrait-card">
        <img class="portrait-img" src="${p.img}" alt="${pData.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="portrait-img" style="display:none">${p.code}</div>
        <div class="portrait-info">
          <h4>${pData.name}</h4>
          <p>${pData.role}</p>
        </div>
      </div>`;
  } else {
    $('#portraitArea').innerHTML = '';
  }

  let controlsHTML = m.controls.map(c=>control(c)).join('');
  
  if (active === 0) { // Interactive Point Plotting Buttons
    controlsHTML += `
      <div class="btnrow" style="margin-top:8px">
        <button class="btn" id="btnP05">${lang==='en'?'Plot Point P = 0.5':'Отрисовать точку P = 0.5'}</button>
        <button class="btn" id="btnP10">${lang==='en'?'Plot Point P = 1.0':'Отрисовать точку P = 1.0'}</button>
        <button class="btn" id="btnP20">${lang==='en'?'Plot Point P = 2.0':'Отрисовать точку P = 2.0'}</button>
        <button class="btn primary" id="btnConnect">${lang==='en'?'Connect Points (AD Curve)':'Соединить точки (Кривая AD)'}</button>
      </div>`;
  } else if (m.buttons) {
    controlsHTML += `<div class="btnrow"><button class="btn primary" id="step">${lang==='en'?'Advance round':'Следующий раунд'}</button><button class="btn" id="auto">${lang==='en'?'Auto-adjust':'Автокоррекция'}</button><button class="btn" id="restart">${lang==='en'?'Reset':'Сбросить'}</button></div>`;
  }

  $('#controls').innerHTML = controlsHTML;
  
  $('#controls').querySelectorAll('input').forEach(inp=>{
    inp.oninput=()=>{state[inp.id]=+inp.value; styleRange(inp); update()};
    styleRange(inp);
  });
  
  if (active === 0) {
    $('#btnP05').onclick = () => { pointsDrawn.p05 = true; update(); };
    $('#btnP10').onclick = () => { pointsDrawn.p10 = true; update(); };
    $('#btnP20').onclick = () => { pointsDrawn.p20 = true; update(); };
    $('#btnConnect').onclick = () => { pointsDrawn.p05 = pointsDrawn.p10 = pointsDrawn.p20 = pointsDrawn.curveDrawn = true; update(); };
  } else if(m.buttons){
    $('#step').onclick=stepAdjust;
    $('#restart').onclick=()=>{adjust=0;round=0;update()};
    $('#auto').onclick=autoAdjust;
  }
  update();
}

function control(c){
  return `<div class="control"><div class="control-top"><label for="${c[0]}">${c[1]}</label><span class="value" id="v-${c[0]}">${fmt(state[c[0]])}</span></div><input id="${c[0]}" type="range" min="${c[2]}" max="${c[3]}" step="${c[5]}" value="${state[c[0]]}" style="--c:${C[c[6]]}"><small>${c[7]}</small></div>`;
}

function styleRange(el){
  const p=(+el.value-+el.min)/(+el.max-+el.min)*100;
  el.style.setProperty('--pct',p+'%');
  const v=$('#v-'+el.id); if(v) v.textContent=fmt(+el.value);
}

const box={l:72,r:720,t:38,b:440}; 
const X=x=>box.l+(x/4000)*(box.r-box.l), Y=y=>box.b-(y/2.5)*(box.b-box.t);
function line(points,color,cls=''){return `<path class="curve ${cls}" stroke="${color}" d="${points.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`}
function axes(){
  let s=''; 
  // Fixed Axis ticks: P = 0.5, 1.0, 2.0
  [0.5, 1.0, 2.0].forEach(p => {
    s += `<line class="grid" x1="${box.l}" y1="${Y(p)}" x2="${box.r}" y2="${Y(p)}"/>`;
    s += `<text class="tick" x="${box.l-12}" y="${Y(p)+4}" text-anchor="end">${p.toFixed(1)}</text>`;
  });
  
  // Y ticks (0 to 4000 млрд)
  for(let y=0; y<=4000; y+=1000){
    s += `<line class="grid" x1="${X(y)}" y1="${box.t}" x2="${X(y)}" y2="${box.b}"/>`;
    s += `<text class="tick" x="${X(y)}" y="${box.b+19}" text-anchor="middle">${y}</text>`;
  }

  return s+`<line class="axis" x1="${box.l}" y1="${box.b}" x2="${box.r}" y2="${box.b}"/><line class="axis" x1="${box.l}" y1="${box.b}" x2="${box.l}" y2="${box.t}"/><text class="label" x="${(box.l+box.r)/2}" y="480" text-anchor="middle">${T[lang].axisX}</text><text class="label" transform="translate(22 ${(box.t+box.b)/2}) rotate(-90)" text-anchor="middle">${T[lang].axisY}</text>`;
}

function equilibrium(A=8.2,b=B,pe=PE,alpha=ALPHA,s=0,yn=YN){const y=(A-pe+alpha*yn-s)/(b+alpha);return {y,p:A-b*y}}
function adPts(A,b=B){const out=[];for(let y=0;y<=10;y+=.1){const p=A-b*y;if(p>=0&&p<=10)out.push([y*400,p/4])}return out}
function asPts(pe=PE,alpha=ALPHA,s=0,yn=YN){return [[0,(pe-alpha*yn+s)/4],[4000,(pe+alpha*(10-yn)+s)/4]]}
function marker(e,label='E'){return `<line class="dash" stroke="#8b95a0" x1="${X(e.y*400)}" y1="${Y(e.p/4)}" x2="${X(e.y*400)}" y2="${box.b}"/><line class="dash" stroke="#8b95a0" x1="${box.l}" y1="${Y(e.p/4)}" x2="${X(e.y*400)}" y2="${Y(e.p/4)}"/><circle class="eq" cx="${X(e.y*400)}" cy="${Y(e.p/4)}" r="6"/><text class="anno" x="${X(e.y*400)+9}" y="${Y(e.p/4)-9}">${label}</text>`}
function legend(items){return items.map((x,i)=>`<line x1="${510}" y1="${24+i*18}" x2="${535}" y2="${24+i*18}" stroke="${x[1]}" stroke-width="3" ${x[2]?'stroke-dasharray="5 4"':''}/><text class="legend" x="542" y="${28+i*18}" fill="${x[1]}">${x[0]}</text>`).join('')}
function metrics(items){$('#metrics').innerHTML=items.map(x=>`<div class="metric"><b>${x[0]}</b><strong>${x[1]}</strong><span>${x[2]||''}</span></div>`).join('')}

function update(){
  const m=T[lang].modules[active]; $('#formula').textContent=m.formula; $('#note').textContent=m.note;
  let svg=axes(), met=[], stat='';

  if(active===0){ // Monetarist Step-by-Step Plotting
    const PY = state.M * state.V;
    const y05 = PY / 0.5;
    const y10 = PY / 1.0;
    const y20 = PY / 2.0;

    // Plot Hyperbola if enabled
    if (pointsDrawn.curveDrawn) {
      let curvePts = [];
      for (let p = 0.4; p <= 2.3; p += 0.05) {
        let y = PY / p;
        if (y <= 4000) curvePts.push([y, p]);
      }
      svg += line(curvePts, C.teal);
    }

    // Render Point 1: P = 0.5
    if (pointsDrawn.p05 && y05 <= 4000) {
      svg += `<circle cx="${X(y05)}" cy="${Y(0.5)}" r="7" fill="${C.red}" stroke="#fff" stroke-width="2"/>`;
      svg += `<text class="anno" x="${X(y05)+9}" y="${Y(0.5)-7}">P=0.5 (Y=${fmt(y05)})</text>`;
    }
    // Render Point 2: P = 1.0
    if (pointsDrawn.p10 && y10 <= 4000) {
      svg += `<circle cx="${X(y10)}" cy="${Y(1.0)}" r="7" fill="${C.gold}" stroke="#fff" stroke-width="2"/>`;
      svg += `<text class="anno" x="${X(y10)+9}" y="${Y(1.0)-7}">P=1.0 (Y=${fmt(y10)})</text>`;
    }
    // Render Point 3: P = 2.0
    if (pointsDrawn.p20 && y20 <= 4000) {
      svg += `<circle cx="${X(y20)}" cy="${Y(2.0)}" r="7" fill="${C.violet}" stroke="#fff" stroke-width="2"/>`;
      svg += `<text class="anno" x="${X(y20)+9}" y="${Y(2.0)-7}">P=2.0 (Y=${fmt(y20)})</text>`;
    }

    met = [
      [lang==='en'?'Money Supply M':'Денежная масса M', fmt(state.M), 'млрд'],
      [lang==='en'?'Velocity V':'Скорость V', fmt(state.V), 'оборотов'],
      [lang==='en'?'Nominal GDP (PY)':'Номинальный ВВП (PY)', fmt(PY), 'млрд']
    ];
    stat = `M = ${fmt(state.M)} · V = ${fmt(state.V)} ⇒ PY = ${fmt(PY)}`;
  }
  else if(active===1){ // Fiscal Policy G vs T
    const netFiscal = state.dG - 0.75 * state.dT;
    const A = 8.2 + netFiscal;
    const e = equilibrium(A);
    svg+=line(adPts(8.2),C.navy,'old')+line(adPts(A),C.teal)+line(asPts(),C.red)+marker(e)+legend([[lang==='en'?'New AD (Fiscal)':'Новая AD (Фискальная)',C.teal],['SRAS',C.red],[lang==='en'?'Initial AD':'Исходная AD',C.navy,true]]);
    met=[
      [lang==='en'?'Gov Purchases G (+)':'Госзакупки G (+)', '+'+fmt(state.dG), 'Стимул'],
      [lang==='en'?'Taxes T (-)':'Налоги T (-)', '-'+fmt(state.dT), 'Сжатие'],
      [lang==='en'?'Net AD Shift':'Чистый сдвиг AD', fmt(netFiscal), 'ΔG − 0.75ΔT']
    ];
    stat = netFiscal > 0 ? (lang==='en'?'Expansionary Fiscal Policy':'Расширительная фискальная политика') : (lang==='en'?'Contractionary Fiscal Policy':'Сдерживающая фискальная политика');
  }
  else if(active===2){ // SRAS
    const s=state.cost-state.prod, e=equilibrium(8.2,B,state.Pe,state.alpha,s);
    svg+=line(asPts(PE,ALPHA,0),C.teal,'old')+line(asPts(state.Pe,state.alpha,s),C.red)+line(adPts(8.2),C.navy)+marker(e)+legend([['AD',C.navy],[lang==='en'?'Current SRAS':'SRAS текущая',C.red],[lang==='en'?'Baseline SRAS':'SRAS базовая',C.teal,true]]);
    met=[[lang==='en'?'Net AS Shock':'Чистый шок AS',fmt(s),lang==='en'?'cost − productivity':'издержки − технология'],[lang==='en'?'Output Y*':'Выпуск Y*',fmt(e.y*400),''],[lang==='en'?'Price P*':'Цены P*',fmt(e.p/4),'']];
    stat=s>0?(lang==='en'?'Adverse Supply Shock (Stagflation)':'Неблагоприятный шок предложения (Стагфляция)'):(s<0?(lang==='en'?'Favorable Supply Shock':'Благоприятный шок предложения'):(lang==='en'?'Baseline SRAS':'Базовое состояние SRAS'));
  }
  else if(active===3){ // AD-SRAS Equilibrium with Shading zones
    const e=equilibrium(state.A,state.b), yd=(state.A-state.trialP)/state.b, ys=YN+(state.trialP-PE)/ALPHA, imb=yd-ys;
    
    // Highlight market excess demand / excess supply
    svg+=`<rect x="${box.l}" y="${box.t}" width="${box.r-box.l}" height="${box.b-box.t}" fill="${imb>0?'rgba(214,87,69,0.05)':'rgba(11,143,140,0.05)'}"/>`;
    svg+=line(adPts(state.A,state.b),C.navy)+line(asPts(),C.teal)+marker(e)+`<line stroke="${C.gold}" stroke-width="2" x1="${box.l}" y1="${Y(state.trialP/4)}" x2="${box.r}" y2="${Y(state.trialP/4)}"/><circle cx="${X(Math.max(0,Math.min(10,yd))*400)}" cy="${Y(state.trialP/4)}" r="5" fill="${C.navy}"/><circle cx="${X(Math.max(0,Math.min(10,ys))*400)}" cy="${Y(state.trialP/4)}" r="5" fill="${C.teal}"/>`+legend([['AD',C.navy],['SRAS',C.teal],[lang==='en'?'Trial P':'Пробная P',C.gold]]);
    met=[[lang==='en'?'Demand Yd':'Спрос Yd',fmt(yd*400),''],[lang==='en'?'Supply Ys':'Предложение Ys',fmt(ys*400),''],[lang==='en'?'Market Imbalance':'Дисбаланс рынка',fmt(imb*400),imb>0?(lang==='en'?'Excess Demand (Shortage)':'Избыточный спрос (Дефицит)'):(lang==='en'?'Excess Supply (Surplus)':'Избыточное предложение (Избыток)')]];
    stat=`${lang==='en'?'Equilibrium':'Равновесие'}: Y* = ${fmt(e.y*400)} · P* = ${fmt(e.p/4)}`;
  }
  else if(active===4){ // Long Run Self Correction with Bold Solid LRAS
    const A=state.gapA, e=equilibrium(A,B,PE,ALPHA,adjust);
    svg+=line(adPts(A),C.navy)+line(asPts(PE,ALPHA,0),C.teal,'old')+line(asPts(PE,ALPHA,adjust),C.red)+`<line class="lras-line" x1="${X(YN*400)}" y1="${box.t}" x2="${X(YN*400)}" y2="${box.b}"/>`+marker(e,`E${round}`)+legend([['AD',C.navy],[lang==='en'?'Current SRAS':'SRAS текущая',C.red],[lang==='en'?'Initial SRAS':'SRAS исходная',C.teal,true],['LRAS (Y♙)',C.gold]]);
    met=[[lang==='en'?'Adjustment Round':'Раунд коррекции',round,''],[lang==='en'?'Output Gap':'Разрыв выпуска',fmt((e.y-YN)*400),'Y − Y♙'],[lang==='en'?'SRAS Shift (s)':'Сдвиг SRAS (s)',fmt(adjust),'']];
    stat=Math.abs(e.y-YN)<.04?(lang==='en'?'Long-Run Equilibrium Restored on LRAS':'Достигнуто долгосрочное равновесие на LRAS'):(e.y>YN?(lang==='en'?'Inflationary Gap (Prices Rising)':'Инфляционный разрыв (Цены растут)'):(lang==='en'?'Recessionary Gap (Prices Falling)':'Рецессионный разрыв (Цены падают)'));
  }
  else if(active===5){ // AD Shocks
    const shock=state.mShock+state.gShock-state.tShock+state.nxShock+state.cShock+state.iShock, A=8.2+shock, e=equilibrium(A), longP=A-B*YN, longS=longP-PE;
    svg+=line(adPts(8.2),C.navy,'old')+line(adPts(A),C.violet)+line(asPts(),C.teal)+line(asPts(PE,ALPHA,longS),C.red,'dash')+`<line class="lras-line" x1="${X(YN*400)}" y1="${box.t}" x2="${X(YN*400)}" y2="${box.b}"/>`+marker(e,'SR')+marker({y:YN,p:longP},'LR')+legend([[lang==='en'?'New AD':'AD новая',C.violet],[lang==='en'?'Initial SRAS':'SRAS исходная',C.teal],[lang==='en'?'Long-Run SRAS':'SRAS в долгом периоде',C.red,true],[lang==='en'?'Baseline AD':'AD базовая',C.navy,true]]);
    met=[[lang==='en'?'Net AD Shock ΔA':'Чистый шок ΔA',fmt(shock),''],[lang==='en'?'Short-Run Y*':'Краткосрочный Y*',fmt(e.y*400),'SR'],[lang==='en'?'Long-Run P*':'Долгосрочный P*',fmt(longP/4),'Y = Y♙']];
    stat=shock>0?(lang==='en'?'Expansionary Demand Shock':'Расширительный шок спроса'):(lang==='en'?'Contractionary Demand Shock':'Сдерживающий шок спроса');
  }
  else if(active===6){ // AS Shocks
    const s=state.wage+state.energy+state.fx-state.technology, e=equilibrium(8.2,B,PE,ALPHA,s);
    svg+=line(adPts(8.2),C.navy)+line(asPts(),C.teal,'old')+line(asPts(PE,ALPHA,s),C.red)+marker(e)+legend([['AD',C.navy],[lang==='en'?'New SRAS':'SRAS новая',C.red],[lang==='en'?'Baseline SRAS':'SRAS базовая',C.teal,true]]);
    met=[[lang==='en'?'Net AS Shock':'Чистый шок AS',fmt(s),''],[lang==='en'?'Change ΔY':'Изменение ΔY',fmt((e.y-equilibrium(8.2).y)*400),''],[lang==='en'?'Change ΔP':'Изменение ΔP',fmt((e.p-equilibrium(8.2).p)/4),'']];
    stat=s>0?(lang==='en'?'Stagflation Pressure (P↑, Y↓)':'Стагфляционное давление (P↑, Y↓)'):(lang==='en'?'Favorable Supply Shock (P↓, Y↑)':'Благоприятный шок предложения (P↓, Y↑)');
  }
  else if(active===7){ // RBC and Hysteresis with Bold Solid LRAS
    const yn1=YN+state.real, A=8.2+state.recession, e0=equilibrium(A,B,PE,ALPHA,0,yn1), scar=state.hyst*Math.min(0,e0.y-yn1), yn2=yn1+scar, e=equilibrium(A,B,PE,ALPHA,0,yn2);
    svg+=line(adPts(A),C.navy)+line(asPts(PE,ALPHA,0,yn2),C.teal)+`<line class="lras-line" stroke="${C.gold}" x1="${X(yn1*400)}" y1="${box.t}" x2="${X(yn1*400)}" y2="${box.b}"/><line class="lras-line" stroke="${C.red}" x1="${X(yn2*400)}" y1="${box.t}" x2="${X(yn2*400)}" y2="${box.b}"/>`+marker(e)+legend([['AD',C.navy],['SRAS',C.teal],[lang==='en'?'LRAS Post-RBC Shock':'LRAS после РБЦ-шока',C.gold,false],[lang==='en'?'LRAS Post-Hysteresis':'LRAS после гистерезиса',C.red,false]]);
    met=[[lang==='en'?'Initial Potential Y♙':'Исходный потенциал Y♙',fmt(yn1*400),''],[lang==='en'?'Persistent Scar':'Устойчивый след (скар)',fmt(scar*400),''],[lang==='en'?'New Potential Y♙′':'Новый потенциал Y♙′',fmt(yn2*400),'']];
    stat=scar<-.02?(lang==='en'?'Hysteresis Reduced Long-Term Potential GDP':'Гистерезис снизил долгосрочный потенциал ВВП'):(lang==='en'?'Minimal Structural Damage':'Минимальный структурный ущерб');
  }

  $('#chart').innerHTML=svg; $('#status').textContent=stat; metrics(met);
}

function stepAdjust(){
  const e=equilibrium(state.gapA,B,PE,ALPHA,adjust), gap=e.y-YN;
  adjust+=state.speed*gap; round++; update();
  if(Math.abs(gap)<.03&&timer){clearInterval(timer);timer=null}
}

function autoAdjust(){
  if(timer){clearInterval(timer);timer=null;return}
  timer=setInterval(stepAdjust,450);
}

$('#ruBtn').onclick=()=>{lang='ru'; resetState(); shell();};
$('#enBtn').onclick=()=>{lang='en'; resetState(); shell();};

resetState();
shell();
</script>
